# An agentmux instance config that uses this setup. Copy it to
# ~/.config/agentmux/instances/<name>.yaml, adjust, then `agentmux start`.
# `agentmux check` reads it and says what is wrong.

setup: ~/code/agentwork
prefix: ctrl+b

panels:
  left:
    command: tray
    description: The agent list
    needs-agents: true
    visible: true
    width: 26
  drawer:
    command: agentmux screen --text drawer
    visible: false
    height: 8
  dock:
    command: agentmux screen --text dock
    visible: false
    width: 40
  right:
    command: agentmux screen --text right
    visible: false
    width: 40
